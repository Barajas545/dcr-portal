<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DCR Portal — Project</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .pj{
        --acc:#2f80d8; --acc-2:#1f6fc8; --tint:rgba(47,128,216,0.12); --tint-2:rgba(47,128,216,0.22);
        --gold:#d6a13a; --ok:#2fa679; --err:#d9614f;
        max-width:1160px; margin:0 auto; padding:14px 16px 60px;
      }
      /* header */
      .pj-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
      .pj-thumb{width:92px; height:60px; border-radius:8px; border:1px solid var(--border);
        background:var(--surface-2); object-fit:cover; flex-shrink:0; display:flex; align-items:center;
        justify-content:center; color:var(--text-muted); font-size:10px; overflow:hidden;}
      .pj-thumb img{width:100%; height:100%; object-fit:cover;}
      .pj-title{font-size:19px; font-weight:800; color:var(--text); line-height:1.25;}
      .pj-sub{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
      .pj-status{display:inline-block; padding:3px 11px; border-radius:14px; font-size:12px;
        font-weight:700; background:var(--tint); color:var(--acc);}
      .pj-switch{position:relative;}
      .pj-switch input{padding:8px 12px; font-size:13px; border:1px solid var(--border);
        border-radius:8px; background:var(--surface); color:var(--text); width:210px;}
      .pj-switch input:focus{outline:none; border-color:var(--acc);}
      .pj-btn{padding:8px 14px; font-size:13px; font-weight:600; border-radius:8px; cursor:pointer;
        border:1px solid var(--border); background:var(--surface); color:var(--text); text-decoration:none; display:inline-block;}
      .pj-btn:hover{background:var(--surface-2);}
      .pj-btn-primary{background:var(--acc); border-color:var(--acc); color:#fff;}
      .pj-btn-primary:hover{background:var(--acc-2);}
      .pj-btn-primary:disabled{background:#7a8595; border-color:#7a8595; cursor:default;}
      .pj-btn-sm{padding:5px 10px; font-size:12px;}
      .pj-msg{font-size:12.5px; min-height:16px;}
      .pj-msg.ok{color:var(--ok);} .pj-msg.err{color:var(--err);}

      /* tabs */
      .pj-tabs{display:flex; gap:4px; border-bottom:2px solid var(--border); margin:8px 0 16px;
        overflow-x:auto; scrollbar-width:none;}
      .pj-tab{padding:9px 15px; font-size:13.5px; font-weight:600; color:var(--text-muted);
        background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-2px;
        cursor:pointer; white-space:nowrap;}
      .pj-tab:hover{color:var(--text);}
      .pj-tab.active{color:var(--acc); border-bottom-color:var(--acc);}
      .pj-pane{display:none;}
      .pj-pane.active{display:block;}

      /* overview form */
      .pj-sec{background:var(--surface); border:1px solid var(--border); border-radius:12px;
        padding:16px; margin-bottom:14px;}
      .pj-sec h3{margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.06em;
        color:var(--text-muted);}
      .pj-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:10px 14px;}
      .pj-f label{display:block; font-size:11.5px; font-weight:600; color:var(--text-muted); margin-bottom:3px;}
      .pj-f input,.pj-f select,.pj-f textarea{width:100%; box-sizing:border-box; padding:8px 10px;
        font-size:13.5px; border:1px solid var(--border); border-radius:7px; background:var(--surface);
        color:var(--text); color-scheme:light dark;}
      .pj-f input:focus,.pj-f select:focus,.pj-f textarea:focus{outline:none; border-color:var(--acc);
        box-shadow:0 0 0 2px var(--tint-2);}
      .pj-f input:disabled,.pj-f textarea:disabled,.pj-f select:disabled{background:var(--surface-2); color:var(--text-muted);}
      .pj-f.full{grid-column:1/-1;}
      .pj-f textarea{resize:vertical; min-height:64px;}
      .pj-check{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text);
        padding:7px 4px; cursor:pointer;}
      .pj-check input{width:16px; height:16px; accent-color:var(--acc);}
      .pj-links{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
      .pj-tagwrap{display:flex; gap:6px; flex-wrap:wrap;}
      .pj-tag{padding:5px 12px; border-radius:15px; font-size:12px; font-weight:600; cursor:pointer;
        border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); user-select:none;}
      .pj-tag.on{background:var(--tint-2); border-color:var(--acc); color:var(--acc);}
      .pj-tag.disabled{cursor:default; opacity:.7;}

      /* tables */
      .pj-tblwrap{overflow-x:auto; border:1px solid var(--border); border-radius:10px; background:var(--surface);}
      table.pj-tbl{border-collapse:collapse; width:100%; font-size:12.5px;}
      .pj-tbl th{background:var(--surface-2); padding:7px 10px; text-align:left; font-size:11px;
        text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); white-space:nowrap;}
      .pj-tbl td{padding:7px 10px; border-top:1px solid var(--border); color:var(--text); vertical-align:top;}
      .pj-tbl td.num,.pj-tbl th.num{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
      .pj-grp td{background:var(--tint); font-weight:700; color:var(--acc); font-size:12.5px;}
      .pj-grpTot td{background:var(--surface-2); font-weight:700;}
      .pj-grand td{background:var(--tint-2); font-weight:800; font-size:13px; color:var(--text);}
      .pj-rowbtns{display:flex; gap:4px;}
      .pj-empty{padding:26px; text-align:center; color:var(--text-muted); font-size:13.5px;}
      .pj-bar{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
      .pj-chip{padding:6px 13px; border-radius:15px; font-size:12.5px; font-weight:600; cursor:pointer;
        border:1px solid var(--border); background:var(--surface); color:var(--text-muted);}
      .pj-chip.on{background:var(--acc); border-color:var(--acc); color:#fff;}
      .pj-search{padding:7px 11px; font-size:13px; border:1px solid var(--border); border-radius:8px;
        background:var(--surface); color:var(--text); min-width:190px;}

      /* logs */
      .pj-log{background:var(--surface); border:1px solid var(--border); border-radius:9px;
        padding:9px 12px; margin-bottom:8px;}
      .pj-log-date{font-size:10.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase;}
      .pj-log-text{font-size:13px; color:var(--text); margin-top:3px; white-space:pre-wrap;}
      .pj-log-user{font-size:10.5px; color:var(--text-muted); margin-top:3px;}

      /* files */
      .pj-crumb{display:flex; gap:4px; align-items:center; flex-wrap:wrap; font-size:13px; margin-bottom:10px;}
      .pj-crumb a{color:var(--acc); cursor:pointer; text-decoration:none;}
      .pj-file{display:flex; align-items:center; gap:10px; padding:9px 12px; border-top:1px solid var(--border);
        cursor:pointer; color:var(--text); font-size:13.5px;}
      .pj-file:first-child{border-top:none;}
      .pj-file:hover{background:var(--surface-2);}
      .pj-file .meta{margin-left:auto; color:var(--text-muted); font-size:11.5px; white-space:nowrap;}

      /* modal */
      .pj-overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
        align-items:center; justify-content:center; z-index:70; padding:14px;}
      .pj-overlay.open{display:flex;}
      .pj-modal{background:var(--surface); color:var(--text); border:1px solid var(--border);
        border-radius:14px; width:100%; max-width:640px; max-height:90vh; overflow-y:auto;
        padding:20px; box-shadow:0 8px 32px rgba(0,0,0,.4);}
      .pj-modal h3{margin:0 0 14px; font-size:16px;}
      .pj-modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}

      @media (max-width:700px){ .pj-switch input{width:130px;} }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand"><div class="brand-badge">DCR</div><h1 id="companyName">DCR Portal</h1></div>
      <div class="top-actions">
        <span class="pill" id="userPill">…</span>
        <a class="btn btn-ghost btn-sm" href="board.html">Board</a>
        <a class="btn btn-ghost btn-sm" href="dashboard.html">Dashboard</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="pj">
      <div class="pj-head">
        <div class="pj-thumb" id="pjThumb">…</div>
        <div style="flex:1;min-width:200px">
          <div class="pj-title" id="pjTitle">Loading…</div>
          <div class="pj-sub" id="pjSub"></div>
        </div>
        <span class="pj-status" id="pjStatus"></span>
        <div class="pj-switch">
          <input id="pjJump" list="pjJumpList" placeholder="Jump to project…" autocomplete="off" />
          <datalist id="pjJumpList"></datalist>
        </div>
        <button class="pj-btn pj-btn-primary" id="pjSave" disabled>💾 Save</button>
      </div>
      <div class="pj-msg" id="pjMsg"></div>

      <div class="pj-tabs" id="pjTabs">
        <button class="pj-tab active" data-tab="overview">Overview</button>
        <button class="pj-tab" data-tab="estimate">Estimate</button>
        <button class="pj-tab" data-tab="takeoffs">Takeoffs</button>
        <button class="pj-tab" data-tab="expenses">Expenses</button>
        <button class="pj-tab" data-tab="tasks">Tasks</button>
        <button class="pj-tab" data-tab="logs">Logs</button>
        <button class="pj-tab" data-tab="mailing">Mailing</button>
        <button class="pj-tab" data-tab="files">Files</button>
      </div>

      <div class="pj-pane active" id="pane-overview"><div class="pj-empty">Loading…</div></div>
      <div class="pj-pane" id="pane-estimate"><div class="pj-empty">Loading…</div></div>
      <div class="pj-pane" id="pane-takeoffs"><div class="pj-empty">Loading…</div></div>
      <div class="pj-pane" id="pane-expenses"><div class="pj-empty">Loading…</div></div>
      <div class="pj-pane" id="pane-tasks"><div class="pj-empty">Loading…</div></div>
      <div class="pj-pane" id="pane-logs"><div class="pj-empty">Loading…</div></div>
      <div class="pj-pane" id="pane-mailing"><div class="pj-empty">Loading…</div></div>
      <div class="pj-pane" id="pane-files"><div class="pj-empty">Loading…</div></div>
    </div>

    <!-- estimate line modal -->
    <div class="pj-overlay" id="estModal">
      <div class="pj-modal">
        <h3 id="estModalTitle">Estimate line</h3>
        <div class="pj-grid" id="estFields"></div>
        <div class="pj-msg err" id="estMsg"></div>
        <div class="pj-modal-actions">
          <button class="pj-btn" id="estCancel">Cancel</button>
          <button class="pj-btn pj-btn-primary" id="estSave">✓ Save line</button>
        </div>
      </div>
    </div>

    <!-- task modal -->
    <div class="pj-overlay" id="taskModal">
      <div class="pj-modal" style="max-width:460px">
        <h3>New task request</h3>
        <div class="pj-f" style="margin-bottom:10px"><label>Task name *</label><input id="tkName" /></div>
        <div class="pj-grid" style="grid-template-columns:1fr 1fr">
          <div class="pj-f"><label>Priority</label>
            <select id="tkPriority"><option value="">—</option><option>Urgent</option><option>Medium</option><option>Low</option></select></div>
          <div class="pj-f"><label>Assigned person</label><input id="tkAssigned" /></div>
        </div>
        <div class="pj-f" style="margin-top:10px"><label>Description</label><textarea id="tkDesc" rows="3"></textarea></div>
        <div class="pj-msg err" id="tkMsg"></div>
        <div class="pj-modal-actions">
          <button class="pj-btn" id="tkCancel">Cancel</button>
          <button class="pj-btn pj-btn-primary" id="tkSave">✓ Create task</button>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="project.js"></script>
  </body>
</html>
