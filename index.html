<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DCR Portal — Sign In</title>
    <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171d25" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DCR Portal" />
    <script>/* theme before first paint; see DCR.theme in common.js */try{var t=localStorage.getItem("dcr_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
  </head>
  <body>
    <div class="auth-wrap">
      <div style="width:100%;max-width:380px">
      <form class="auth-card" id="loginForm" autocomplete="on">
        <div class="brand" style="flex-direction:column;align-items:center;gap:12px">
          <span style="background:#fff;border-radius:14px;padding:10px;display:inline-flex;box-shadow:0 1px 4px rgba(0,0,0,.15)">
            <img id="companyLogo" src="logo.jpg" alt="" style="height:74px;width:auto" />
          </span>
          <h1 id="companyName">DCR Portal</h1>
        </div>
        <p class="subtitle">Sign in to access your dashboard.</p>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="username" />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />

        <label class="keepme">
          <input type="checkbox" id="remember" />
          <span>Keep me signed in on this device<br />
            <small>Stay signed in until you sign out. Don’t tick this on a shared computer.</small></span>
        </label>

        <button class="btn btn-block" type="submit" id="submitBtn">Sign In</button>
        <div class="msg error" id="err"></div>
      </form>
      <div id="installSlot" style="text-align:center;margin-top:14px"></div>
      </div>
    </div>

    <style>
      /* The whole label is the hit target — a 16px tick box is a poor one on a
         phone, which is where most of these sign-ins happen. */
      .keepme { display: flex; align-items: flex-start; gap: 10px; margin: 16px 0 4px;
        font-size: 13.5px; font-weight: 500; cursor: pointer; line-height: 1.45; }
      .keepme input { width: 18px; height: 18px; margin: 1px 0 0; flex: none; cursor: pointer; }
      .keepme small { color: var(--text-muted); font-size: 11.5px; font-weight: 400; }
    </style>

    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="install.js"></script>
    <script>
      document.getElementById("companyName").textContent = DCR.company + " Portal";
      document.getElementById("companyLogo").src = DCR.companyInfo.logo;

      // If already signed in, skip straight to the dashboard.
      if (DCR.getToken()) {
        DCR.api("/api/portal?action=me")
          // replace, not assign: a sign-in page that stays in history is a
          // back-target that bounces you straight forward again.
          .then(() => location.replace("dashboard.html"))
          .catch((e) => {
            /* Only a real 401 means the session is over. This used to bin the
               token on ANY error, so one bad moment of signal on the landing
               page threw away a thirty-day session and asked for the password
               again — precisely what the tick box exists to prevent. On a
               connection error we keep the token and let them sign in or retry. */
            if (e && e.status === 401) DCR.clearToken();
          });
      }

      const form = document.getElementById("loginForm");
      const err = document.getElementById("err");
      const btn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.classList.remove("show");
        btn.disabled = true;
        btn.textContent = "Signing in…";
        try {
          const data = await DCR.api("/api/portal?action=login", {
            method: "POST",
            auth: false,
            body: {
              email: document.getElementById("email").value.trim(),
              password: document.getElementById("password").value,
              remember: document.getElementById("remember").checked,
            },
          });
          DCR.setToken(data.token);
          location.replace("dashboard.html");
        } catch (ex) {
          err.textContent = ex.message || "Sign in failed.";
          err.classList.add("show");
          btn.disabled = false;
          btn.textContent = "Sign In";
        }
      });
    </script>
  </body>
</html>
