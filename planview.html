<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>DCR — Plan Viewer</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      html,body{height:100%;}
      body{display:flex; flex-direction:column; overflow:hidden;}
      .pv{--acc:#2f80d8; --acc-2:#1f6fc8; --tint:rgba(47,128,216,.12); --tint-2:rgba(47,128,216,.25);
        --gold:#d6a13a; --ok:#2fa679; --err:#d9614f;
        flex:1; display:flex; flex-direction:column; min-height:0;}

      .pv-bar{display:flex; align-items:center; gap:6px; padding:6px 10px; flex-wrap:wrap;
        background:var(--surface); border-bottom:1px solid var(--border);}
      .pv-name{font-size:13px; font-weight:700; color:var(--text); max-width:26vw;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
      .pv-btn{padding:6px 10px; font-size:12.5px; font-weight:600; border-radius:7px; cursor:pointer;
        border:1px solid var(--border); background:var(--surface); color:var(--text); text-decoration:none; user-select:none;}
      .pv-btn:hover{background:var(--surface-2);}
      .pv-btn.primary{background:var(--acc); border-color:var(--acc); color:#fff;}
      .pv-btn:disabled{opacity:.45; cursor:default;}
      .pv-sel{padding:6px 8px; font-size:12.5px; border:1px solid var(--border); border-radius:7px;
        background:var(--surface); color:var(--text); width:auto; cursor:pointer;}
      .pv-sep{width:1px; height:22px; background:var(--border); margin:0 3px; flex-shrink:0;}
      .pv-note{font-size:11px; color:var(--text-muted);}

      .pv-tool{width:38px; height:34px; border-radius:8px; border:1px solid var(--border);
        background:var(--surface); color:var(--text); cursor:pointer; font-size:15px; flex-shrink:0;}
      .pv-tool:hover{background:var(--surface-2);}
      .pv-tool.on{background:var(--acc); border-color:var(--acc); color:#fff;}
      .pv-color{width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer; flex-shrink:0;}
      .pv-color.on{border-color:var(--text); box-shadow:0 0 0 2px var(--tint-2);}

      .pv-main{flex:1; display:flex; min-height:0;}
      #viewport{flex:1; overflow:auto; background:#26282c; position:relative;
        -webkit-overflow-scrolling:touch; touch-action:none;}
      #viewWrap{position:relative; margin:14px auto; width:0; height:0; background:#fff;
        box-shadow:0 3px 18px rgba(0,0,0,.5);}
      #pgCanvas{position:absolute; left:0; top:0;}
      #ovCanvas{position:absolute; left:0; top:0; touch-action:none;}

      .pv-side{width:280px; flex-shrink:0; border-left:1px solid var(--border); background:var(--surface);
        display:none; flex-direction:column; min-height:0;}
      .pv-side.open{display:flex;}
      .pv-side-head{display:flex; align-items:center; justify-content:space-between; padding:10px 12px 6px;
        font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted);}
      .pv-side-body{flex:1; overflow-y:auto; padding:0 12px 14px; font-size:12.5px; color:var(--text);}
      .pv-sum-grp{margin-top:10px; font-weight:700; color:var(--acc); font-size:12px;}
      .pv-sum-row{display:flex; justify-content:space-between; gap:8px; padding:3px 0; border-bottom:1px solid var(--border);}
      .pv-sum-row .v{font-weight:700; white-space:nowrap;}

      .pv-status{display:flex; align-items:center; gap:12px; padding:4px 12px; font-size:11.5px;
        color:var(--text-muted); background:var(--surface); border-top:1px solid var(--border);
        white-space:nowrap; overflow:hidden;}
      #pvHint{flex:1; overflow:hidden; text-overflow:ellipsis;}

      .pv-load{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
        color:#bbb; font-size:14px; flex-direction:column; gap:10px;}

      /* modals */
      .pv-overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
        align-items:center; justify-content:center; z-index:80; padding:14px;}
      .pv-overlay.open{display:flex;}
      .pv-modal{background:var(--surface); color:var(--text); border:1px solid var(--border);
        border-radius:13px; width:100%; max-width:380px; padding:18px; box-shadow:0 8px 30px rgba(0,0,0,.5);}
      .pv-modal h3{margin:0 0 12px; font-size:15px;}
      .pv-f{margin-bottom:10px;}
      .pv-f label{display:block; font-size:11.5px; font-weight:600; color:var(--text-muted); margin-bottom:4px;}
      .pv-f input, .pv-f textarea{width:100%; box-sizing:border-box; padding:8px 10px; font-size:14px;
        border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text);}
      .pv-row{display:flex; gap:8px;}
      .pv-row .pv-f{flex:1;}
      .pv-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:10px;}

      @media (max-width:820px){
        .pv-name{max-width:40vw;}
        .pv-side{position:fixed; right:0; top:0; bottom:0; z-index:60; box-shadow:-6px 0 24px rgba(0,0,0,.4);}
      }
    </style>
  </head>
  <body>
    <div class="pv">
      <!-- row 1: file / pages / zoom / scale / save -->
      <div class="pv-bar">
        <a class="pv-btn" id="pvBack" href="plans.html">←</a>
        <span class="pv-name" id="pvName">Loading…</span>
        <span class="pv-sep"></span>
        <button class="pv-btn" id="pgPrev">◀</button>
        <span class="pv-note" id="pgInfo">–/–</span>
        <button class="pv-btn" id="pgNext">▶</button>
        <span class="pv-sep"></span>
        <button class="pv-btn" id="zOut">−</button>
        <span class="pv-note" id="zPct">100%</span>
        <button class="pv-btn" id="zIn">＋</button>
        <button class="pv-btn" id="zFitW" title="Fit width">⇔</button>
        <button class="pv-btn" id="zFitP" title="Fit page">⛶</button>
        <span class="pv-sep"></span>
        <select class="pv-sel" id="pvScale" title="Drawing scale"></select>
        <button class="pv-btn" id="tCal" title="Calibrate scale from a known dimension">🎯</button>
        <select class="pv-sel" id="pvTol" title="Measurement precision">
          <option value="1">to 1"</option>
          <option value="2">to 1/2"</option>
          <option value="4">to 1/4"</option>
          <option value="8" selected>to 1/8"</option>
          <option value="16">to 1/16"</option>
        </select>
        <span style="flex:1"></span>
        <button class="pv-btn" id="pvSum">Σ Takeoff</button>
        <button class="pv-btn primary" id="pvSave">💾 Save Notes</button>
      </div>
      <!-- row 2: tools -->
      <div class="pv-bar" style="padding-top:4px">
        <button class="pv-tool on" data-tool="pan" title="Select / Pan (V)">✥</button>
        <button class="pv-tool" data-tool="measure" title="Measure distance (M)">📏</button>
        <button class="pv-tool" data-tool="poly" title="Lineal ft polyline (P)">〰</button>
        <button class="pv-tool" data-tool="area" title="Area (A)">⬠</button>
        <button class="pv-tool" data-tool="count" title="Count items (C)">🔢</button>
        <span class="pv-sep"></span>
        <button class="pv-tool" data-tool="hl" title="Highlighter (H)">🖍</button>
        <button class="pv-tool" data-tool="hlbox" title="Box highlight (B)">▭</button>
        <button class="pv-tool" data-tool="arrow" title="Arrow">➤</button>
        <button class="pv-tool" data-tool="text" title="Text note (T)">T</button>
        <button class="pv-tool" data-tool="callout" title="Text with arrow">💬</button>
        <button class="pv-tool" data-tool="erase" title="Eraser (E)">🧽</button>
        <span class="pv-sep"></span>
        <span id="pvColors" style="display:flex;gap:5px;align-items:center"></span>
        <select class="pv-sel" id="pvWidth" title="Line width">
          <option value="1.5">Thin</option><option value="3" selected>Medium</option><option value="6">Thick</option>
        </select>
        <span class="pv-sep"></span>
        <button class="pv-btn" id="pvUndo" title="Undo (Ctrl+Z)">↶</button>
        <button class="pv-btn" id="pvRedo" title="Redo (Ctrl+Y)">↷</button>
        <button class="pv-btn" id="pvEye" title="Show/hide annotations">👁</button>
        <button class="pv-btn" id="pvDel" title="Delete selected (Del)" style="display:none">🗑</button>
      </div>

      <div class="pv-main">
        <div id="viewport">
          <div id="viewWrap">
            <canvas id="pgCanvas"></canvas>
            <canvas id="ovCanvas"></canvas>
          </div>
          <div class="pv-load" id="pvLoad">Loading plan…</div>
        </div>
        <aside class="pv-side" id="sumPanel">
          <div class="pv-side-head"><span>Takeoff summary</span>
            <button class="pv-btn" id="sumCopy" style="padding:3px 8px">📋 Copy</button></div>
          <div class="pv-side-body" id="sumBody"><div class="pv-note" style="padding:10px 0">No measurements yet.</div></div>
        </aside>
      </div>

      <div class="pv-status">
        <span id="pvHint">Pick a tool to begin.</span>
        <span id="pvScaleInfo"></span>
      </div>
    </div>

    <!-- text / callout input -->
    <div class="pv-overlay" id="txtModal">
      <div class="pv-modal">
        <h3 id="txtTitle">Text note</h3>
        <div class="pv-f"><textarea id="txtInput" rows="3" placeholder="Type the note…"></textarea></div>
        <div class="pv-actions">
          <button class="pv-btn" id="txtCancel">Cancel</button>
          <button class="pv-btn primary" id="txtOk">✓ Place</button>
        </div>
      </div>
    </div>

    <!-- calibrate -->
    <div class="pv-overlay" id="calModal">
      <div class="pv-modal">
        <h3>🎯 Calibrate scale</h3>
        <p class="pv-note" style="margin:0 0 10px">You drew a line over a known dimension. Enter its real length:</p>
        <div class="pv-row">
          <div class="pv-f"><label>Feet</label><input id="calFt" type="number" min="0" step="1" value="0" /></div>
          <div class="pv-f"><label>Inches</label><input id="calIn" type="number" min="0" step="0.125" value="0" /></div>
        </div>
        <div class="pv-note" id="calInfo"></div>
        <div class="pv-actions">
          <button class="pv-btn" id="calCancel">Cancel</button>
          <button class="pv-btn primary" id="calOk">✓ Set scale for this page</button>
        </div>
      </div>
    </div>

    <!-- count label -->
    <div class="pv-overlay" id="cntModal">
      <div class="pv-modal">
        <h3>🔢 Count — what are you counting?</h3>
        <div class="pv-f"><label>Label (e.g. "Windows", "Posts", "Outlets")</label><input id="cntLabel" /></div>
        <div class="pv-actions">
          <button class="pv-btn" id="cntCancel">Cancel</button>
          <button class="pv-btn primary" id="cntOk">✓ Start counting</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="planview.js"></script>
  </body>
</html>
