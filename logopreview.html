<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logo preview</title>
    <style>
      body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
      .bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid}
      .brand{display:flex;align-items:center;gap:10px}
      .bar img{height:32px;width:auto;object-fit:contain;display:block;flex-shrink:0}
      .bar h1{font-size:16px;margin:0}
      .light{background:#fff;color:#1b2733;border-color:#dfe3e8}
      .dark{background:#171d25;color:#e6ebf1;border-color:#2a333d}
      .dark img{filter:invert(1)}
      .pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(127,127,127,.18)}
      .lbl{padding:10px 20px;font-size:12px;color:#888}
    </style>
  </head>
  <body>
    <div class="lbl">LIGHT MODE (topbar surface = #fff, logo shown as-is)</div>
    <div class="bar light">
      <div class="brand"><img src="logo.png" alt="DCR Framing" /><h1>DCR Framing Portal</h1></div>
      <span class="pill">Cristobal · Admin</span>
    </div>
    <div class="lbl">DARK MODE (topbar surface = #171d25, logo inverted to white)</div>
    <div class="bar dark">
      <div class="brand"><img src="logo.png" alt="DCR Framing" /><h1>DCR Framing Portal</h1></div>
      <span class="pill">Cristobal · Admin</span>
    </div>
  </body>
</html>
