<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DCR Portal — My Tasks</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* My Tasks is opened from a reminder on a phone far more often than from
         a desk, so it is laid out for a phone first: one column of cards, and
         a task opens as a full-screen view with its own way back. From 960px
         the task sits beside the list instead. */
      .mt{
        --acc:#2f80d8; --acc-2:#1f6fc8; --tint:rgba(47,128,216,.12); --tint-2:rgba(47,128,216,.22);
        --warn:#c8371f; --warn-bg:rgba(200,55,31,.10); --ok-text:#1f7a55; --ok-bg:rgba(31,157,85,.10);
        --gold:#a46a12; --gold-bg:rgba(183,121,31,.14);
        max-width:1180px; margin:0 auto; padding:14px 16px calc(40px + env(safe-area-inset-bottom));
      }
      @media (prefers-color-scheme: dark){
        :root:not([data-theme="light"]) .mt{ --warn:#f0937f; --warn-bg:rgba(240,147,127,.13); --ok-text:#6fd3a4;
          --ok-bg:rgba(111,211,164,.12); --gold:#e0b25a; --gold-bg:rgba(224,178,90,.14); --tint-2:rgba(77,155,240,.30); }
      }
      /* The same, chosen explicitly in Settings rather than read
         from the operating system. */
      :root[data-theme="dark"] .mt{ --warn:#f0937f; --warn-bg:rgba(240,147,127,.13); --ok-text:#6fd3a4;
        --ok-bg:rgba(111,211,164,.12); --gold:#e0b25a; --gold-bg:rgba(224,178,90,.14); --tint-2:rgba(77,155,240,.30); }

      .mt-layout{display:block;}
      .mt-head h2{margin:4px 0 2px; font-size:22px; line-height:1.25;}
      .mt-head h2:focus{outline:none;}
      .top-actions a.btn{text-decoration:none;}
      /* Map, Home and the Mark complete question's buttons are the shared .btn-sm,
         about 33px tall. This page is used on a phone, so they get the same 44px
         reach as every other control on it. */
      .top-actions .btn, .dcr-mo-ft .btn{min-height:44px;}
      .mt-sub{margin:0 0 12px; color:var(--text-muted); font-size:14px; min-height:21px;}
      .mt-sub b{color:var(--warn);}

      /* Mine / everyone's */
      .mt-seg{display:inline-flex; gap:3px; padding:3px; margin:0 0 6px; background:var(--surface-2);
        border:1px solid var(--border); border-radius:12px; max-width:100%;}
      .mt-seg[hidden]{display:none;}
      .mt-seg button{min-height:44px; padding:8px 14px; border:0; border-radius:9px; background:transparent;
        color:var(--text-muted); font-weight:700; font-size:14px; white-space:nowrap;}
      .mt-seg button[aria-pressed="true"]{background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.14);}
      .mt-seg button:focus-visible{outline:2px solid var(--acc); outline-offset:1px;}

      /* Messages about a link that was opened, or a task just closed */
      .mt-notice{display:flex; flex-direction:column; gap:6px; padding:14px; margin:8px 0 12px; border-radius:12px;
        background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--acc);}
      .mt-notice.ok{border-left-color:var(--ok); background:var(--ok-bg);}
      .mt-notice.warn{border-left-color:var(--warn);}
      .mt-notice b{font-size:15.5px;}
      .mt-notice span{font-size:14px; color:var(--text);}
      .mt-notice .mt-nbtn{align-self:flex-start; margin-top:4px; min-height:44px; padding:8px 14px; border-radius:10px;
        border:1px solid var(--border); background:var(--surface); color:var(--text); font-weight:700;}
      .mt-notice .mt-nbtn:focus-visible{outline:2px solid var(--acc); outline-offset:1px;}

      /* Groups and cards */
      .mt-grp{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:18px 0 8px; font-size:12px; font-weight:800;
        text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted);}
      .mt-grp .who{text-transform:none; letter-spacing:0; font-size:15px; color:var(--text);}
      .mt-grp .why{text-transform:none; letter-spacing:0; font-weight:600; font-size:12.5px; color:var(--warn);}
      /* Not upper case like the heading it sits in: in a person's heading it
         carries words ("3 need an update"), which would shout in capitals. */
      .mt-n{min-width:22px; padding:1px 8px; border-radius:11px; background:var(--surface-2); color:var(--text);
        font-size:12px; text-align:center; letter-spacing:0; text-transform:none;}
      .mt-n.warn{background:var(--warn); color:#fff;}
      :root[data-theme="dark"] .mt-n.warn{color:#2a0d07;}
      @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .mt-n.warn{color:#2a0d07;} }
      .mt-card{background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--border);
        border-radius:12px; margin-bottom:10px; overflow:hidden;}
      .mt-card.needs{border-left-color:var(--warn);}
      .mt-card.sel{border-color:var(--acc); box-shadow:0 0 0 2px var(--tint-2);}
      .mt-open{display:block; width:100%; text-align:left; background:none; border:0; color:var(--text);
        padding:12px 14px 4px; min-height:44px; font:inherit; -webkit-tap-highlight-color:transparent;}
      .mt-open:hover{background:var(--surface-2);}
      .mt-open:focus-visible{outline:2px solid var(--acc); outline-offset:-2px;}
      .mt-row1{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
      .mt-name{font-weight:700; font-size:16px; line-height:1.3; overflow-wrap:anywhere;}
      .mt-chip{flex:none; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:800; letter-spacing:.03em;
        text-transform:uppercase; background:var(--surface-2); color:var(--text-muted);}
      .mt-chip.urgent{background:var(--warn-bg); color:var(--warn);}
      .mt-chip.medium{background:var(--gold-bg); color:var(--gold);}
      .mt-when{display:block; margin-top:4px; font-size:13.5px; font-weight:600; color:var(--text-muted);}
      .mt-when.warn{color:var(--warn);}
      .mt-last{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:3px;
        font-size:13.5px; color:var(--text-muted); overflow-wrap:anywhere;}
      .mt-place{display:flex; flex-wrap:wrap; align-items:center; gap:0 8px; padding:0 14px 4px; font-size:13px; color:var(--text-muted);}
      .mt-place .proj{overflow-wrap:anywhere;}
      .mt-dir{display:inline-flex; align-items:center; min-height:44px; color:var(--acc); font-weight:600;
        text-decoration:none; overflow-wrap:anywhere;}
      .mt-dir:hover{text-decoration:underline;}
      .mt-dir:focus-visible{outline:2px solid var(--acc); outline-offset:2px; border-radius:4px;}
      .mt-empty{padding:28px 16px; text-align:center; color:var(--text-muted); background:var(--surface);
        border:1px dashed var(--border); border-radius:12px; margin-top:12px;}
      .mt-empty b{display:block; color:var(--text); font-size:16px; margin-bottom:4px;}
      .mt-skel{height:86px; border-radius:12px; margin-bottom:10px; background:var(--surface); border:1px solid var(--border);
        opacity:.6;}
      .mt-foot{display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:22px; padding-top:12px; border-top:1px solid var(--border);
        font-size:14px;}
      .mt-foot a{display:inline-flex; align-items:center; min-height:44px; color:var(--acc); font-weight:600; text-decoration:none;}

      /* The task. Off-canvas on a phone until a task is opened; then it is the
         whole screen, sized to the part the keyboard leaves visible (--vvh is
         set from visualViewport), so Send never ends up under the keyboard. */
      .mt-detail{display:none;}
      .mt-detail.open{display:flex; flex-direction:column; position:fixed; inset:0; z-index:40;
        height:var(--vvh, 100dvh); background:var(--bg);}
      .mt-dbar{display:flex; align-items:center; justify-content:space-between; gap:8px; flex:none;
        padding:calc(6px + env(safe-area-inset-top)) 8px 6px; background:var(--surface); border-bottom:1px solid var(--border);}
      .mt-back{min-height:44px; padding:8px 12px; border:0; background:none; color:var(--acc); font-weight:700; font-size:15.5px;}
      .mt-back:focus-visible, .mt-x:focus-visible{outline:2px solid var(--acc); outline-offset:1px; border-radius:8px;}
      .mt-x{display:none; width:44px; height:44px; border:1px solid var(--border); border-radius:10px;
        background:var(--surface); color:var(--text); font-size:22px; line-height:1;}
      .mt-dscroll{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
        padding:16px 16px calc(28px + env(safe-area-inset-bottom));}
      .mt-ph{padding:40px 24px; text-align:center; color:var(--text-muted); font-size:14.5px;}
      .mt-dtop{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px;}
      .mt-dtitle{margin:0 0 4px; font-size:21px; line-height:1.25; overflow-wrap:anywhere;}
      .mt-dtitle:focus{outline:none;}
      .mt-dtitle:focus-visible{outline:2px solid var(--acc); outline-offset:3px; border-radius:4px;}
      .mt-dplace{font-size:14px; color:var(--text-muted); overflow-wrap:anywhere;}
      .mt-dwhen{margin-top:2px; font-size:14px; font-weight:700; color:var(--text-muted);}
      .mt-dwhen.warn{color:var(--warn);}
      .mt-desc{margin:12px 0 0; padding:10px 12px; border-radius:10px; background:var(--surface); border:1px solid var(--border);
        font-size:14.5px; white-space:pre-wrap; overflow-wrap:anywhere;}
      .mt-facts{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:12px 0 0; font-size:13.5px;}
      .mt-facts dt{color:var(--text-muted); font-weight:600;}
      .mt-facts dd{margin:0; overflow-wrap:anywhere;}

      .mt-compose{margin:16px 0 4px; padding:12px; border-radius:12px; background:var(--surface); border:1px solid var(--border);}
      .mt-label{display:block; margin:0 0 8px; font-size:14px; font-weight:800;}
      .mt-quick{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
      .mt-quick button{min-height:44px; padding:8px 12px; border:1px solid var(--border); border-radius:22px;
        background:var(--surface-2); color:var(--text); font-size:13.5px; font-weight:600;}
      .mt-quick button:hover{border-color:var(--acc);}
      .mt-quick button:focus-visible{outline:2px solid var(--acc); outline-offset:1px;}
      .mt-quick .done{border-color:var(--ok); color:var(--ok-text); background:var(--ok-bg);}
      .mt-datepick{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 8px;}
      .mt-datepick[hidden]{display:none;}
      .mt-datepick label{margin:0; font-size:13px;}
      .mt-datepick input{width:auto; min-height:44px; font-size:16px; color-scheme:light dark;}
      .mt-dateadd{min-height:44px; padding:8px 18px; border:0; border-radius:10px; background:var(--acc); color:#fff;
        font-weight:800; font-size:15px;}
      .mt-dateadd:hover{background:var(--acc-2);}
      .mt-dateadd:focus-visible{outline:2px solid var(--text); outline-offset:2px;}
      .mt-text{display:block; min-height:96px; font-family:inherit; font-size:16px; line-height:1.45; resize:vertical; border-radius:10px;
        background:var(--bg); color-scheme:light dark;}
      .mt-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:10px; margin-top:10px;}
      .mt-status{flex:1 1 180px; font-size:13.5px; color:var(--text-muted); min-height:20px;}
      .mt-status.ok{color:var(--ok-text); font-weight:700;}
      .mt-status.err{color:var(--warn); font-weight:600;}
      .mt-send{min-height:48px; padding:10px 22px; border:0; border-radius:12px; background:var(--acc); color:#fff;
        font-weight:800; font-size:16px;}
      .mt-send:hover{background:var(--acc-2);}
      .mt-send:disabled{opacity:.6; cursor:default;}
      .mt-send:focus-visible{outline:2px solid var(--text); outline-offset:2px;}
      .mt-next[hidden]{display:none;}
      .mt-nextbtn{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; width:100%; margin-top:10px; min-height:48px;
        padding:10px 14px; text-align:left; border-radius:12px; border:1px solid var(--warn); background:var(--warn-bg); color:var(--text);}
      .mt-nextbtn small{color:var(--warn); font-weight:700;}
      .mt-nextbtn:focus-visible{outline:2px solid var(--acc); outline-offset:1px;}

      .mt-h3{display:flex; align-items:center; gap:8px; margin:20px 0 8px; font-size:12px; font-weight:800;
        text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted);}
      .mt-history{list-style:none; margin:0 0 0 6px; padding:0; border-left:2px solid var(--border);}
      .mt-note{position:relative; padding:0 0 14px 16px;}
      .mt-note::before{content:""; position:absolute; left:-7px; top:6px; width:12px; height:12px; border-radius:50%;
        background:var(--surface); border:2px solid var(--border); box-sizing:border-box;}
      .mt-note:first-child::before{background:var(--acc); border-color:var(--acc);}
      .mt-note.fresh{animation:mtFresh 2.6s ease-out;}
      @keyframes mtFresh{0%{background:var(--tint-2);} 100%{background:transparent;}}
      .mt-nday{font-size:12.5px; font-weight:700; color:var(--text-muted);}
      .mt-ntext{font-size:14.5px; white-space:pre-wrap; overflow-wrap:anywhere;}
      .mt-none{color:var(--text-muted); font-size:14px; padding:4px 0 8px 16px;}
      .mt-dactions{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; padding-top:14px; border-top:1px solid var(--border);}
      .mt-complete{min-height:48px; padding:10px 18px; border-radius:12px; border:1px solid var(--ok); background:var(--ok-bg);
        color:var(--ok-text); font-weight:800;}
      .mt-complete:disabled{opacity:.6;}
      .mt-photo{display:inline-flex; align-items:center; gap:6px; min-height:48px; padding:10px 16px; border-radius:12px;
        border:1px solid var(--border); background:var(--surface); color:var(--text); font-weight:700; text-decoration:none;}
      .mt-complete:focus-visible, .mt-photo:focus-visible{outline:2px solid var(--acc); outline-offset:2px;}

      html.mt-locked, html.mt-locked body{overflow:hidden;}

      @media (max-width:560px){
        .mt-pill{display:none;}
        .topbar{padding:10px 12px;}
        .top-actions{gap:6px;}
      }
      @media (min-width:960px){
        .mt-layout{display:grid; grid-template-columns:minmax(0,1fr) minmax(380px,460px); gap:22px; align-items:start;}
        .mt-detail, .mt-detail.open{display:flex; flex-direction:column; position:sticky; inset:auto; top:72px; z-index:auto;
          height:auto; max-height:calc(100vh - 92px); background:var(--surface); border:1px solid var(--border);
          border-radius:14px; box-shadow:var(--shadow); overflow:hidden;}
        .mt-dbar{padding:6px 8px; justify-content:flex-end;}
        .mt-back{display:none;}
        .mt-x{display:inline-flex; align-items:center; justify-content:center;}
        .mt-detail:not(.open) .mt-dbar{display:none;}
        .mt-compose, .mt-desc{background:var(--bg);}
      }
    </style>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171d25" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DCR Portal" />
    <script>/* theme before first paint; see DCR.theme in common.js */try{var t=localStorage.getItem("dcr_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
  </head>
  <body>
    <div class="topbar">
      <div class="brand"><img class="brand-logo" src="logo.png" alt="DCR Framing" /><h1>My Tasks</h1></div>
      <div class="top-actions">
        <span class="pill mt-pill" id="userPill">…</span>
        <a class="btn btn-ghost btn-sm" href="tasks-map.html">Map</a>
        <a class="btn btn-ghost btn-sm" href="dashboard.html">Home</a>
      </div>
    </div>

    <main class="mt">
      <div class="mt-layout">
        <section class="mt-listcol" id="mtListCol" aria-labelledby="mtTitle">
          <header class="mt-head">
            <h2 id="mtTitle" tabindex="-1">My tasks</h2>
            <p class="mt-sub" id="mtSub">Loading your tasks…</p>
          </header>
          <div class="mt-seg" id="mtSeg" role="group" aria-label="Whose tasks" hidden>
            <button type="button" id="mtSegMine" data-view="mine" aria-pressed="true">Mine</button>
            <button type="button" id="mtSegAll" data-view="all" aria-pressed="false">Everyone's tasks</button>
          </div>
          <div id="mtNotice" role="status" aria-live="polite"></div>
          <div id="mtList" aria-busy="true">
            <div class="mt-skel"></div><div class="mt-skel"></div><div class="mt-skel"></div>
          </div>
          <footer class="mt-foot">
            <a href="tasks-map.html">Open the tasks map</a>
            <a href="capture.html">Site photos</a>
          </footer>
        </section>

        <section class="mt-detail" id="mtDetail" role="region" aria-label="Task">
          <div class="mt-dbar">
            <button type="button" class="mt-back" id="mtBack">‹ All my tasks</button>
            <button type="button" class="mt-x" id="mtClose" aria-label="Close this task">×</button>
          </div>
          <div class="mt-dscroll" id="mtDScroll">
            <div class="mt-ph">Pick a task to see its updates and send one.</div>
          </div>
        </section>
      </div>
    </main>

    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="my-tasks.js"></script>
  </body>
</html>
