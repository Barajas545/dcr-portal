<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DCR — Expense Report</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .rp-controls{
        display:flex; align-items:center; gap:10px; flex-wrap:wrap;
        padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border);
        position:sticky; top:0; z-index:10;
      }
      .rp-btn{padding:8px 14px; font-size:13px; font-weight:600; border-radius:8px; cursor:pointer;
        border:1px solid var(--border); background:var(--surface); color:var(--text); text-decoration:none;}
      .rp-btn:hover{background:var(--surface-2);}
      .rp-btn-primary{background:#2f80d8; border-color:#2f80d8; color:#fff;}

      .sheet{
        max-width:8.5in; margin:18px auto; background:#fff; color:#111;
        padding:0.6in 0.7in; box-shadow:0 3px 20px rgba(0,0,0,.25);
        font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:1.4;
      }
      .lh{display:flex; align-items:center; justify-content:space-between; gap:14px;
        border-bottom:3px solid #111; padding-bottom:12px; margin-bottom:14px;}
      .lh img{height:44px; width:auto;}
      .lh h1{margin:0; font-size:20px; letter-spacing:.1em;}
      .who{display:flex; justify-content:space-between; margin-bottom:14px; font-size:12.5px;}
      table.ex{width:100%; border-collapse:collapse;}
      .ex th{border-bottom:2px solid #111; padding:5px 7px; text-align:left; font-size:10px;
        letter-spacing:.07em; text-transform:uppercase;}
      .ex th.amt,.ex td.amt{text-align:right; white-space:nowrap; width:88px;}
      .ex td{padding:5px 7px; border-bottom:1px solid #ddd; vertical-align:top;}
      .ex tr.grp td{background:#f0f0f0; font-weight:700; border-bottom:1px solid #999; padding-top:8px;}
      .ex tr.sub td{font-weight:700; border-bottom:2px solid #999; background:#fafafa;}
      .ex tr.grand td{font-weight:700; font-size:13px; border-top:3px double #111; border-bottom:none; padding-top:9px;}
      .group-block{break-inside:avoid;}
      .foot{margin-top:22px; font-size:10px; color:#777; text-align:center;}
      .rp-loading{text-align:center; color:var(--text-muted); padding:60px 0;}

      @media print{
        .rp-controls{display:none !important;}
        body{background:#fff !important;}
        .sheet{box-shadow:none; margin:0; max-width:none; padding:0;}
        @page{margin:0.6in 0.65in;}
      }
    </style>
  </head>
  <body>
    <div class="rp-controls">
      <a class="rp-btn" id="rpBack" href="board.html">← Back</a>
      <button class="rp-btn rp-btn-primary" style="margin-left:auto" onclick="window.print()">🖨 Print / Save PDF</button>
    </div>

    <div id="rpSheet" class="sheet"><div class="rp-loading">Loading expense report…</div></div>

    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="report-expenses.js"></script>
  </body>
</html>
