<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DCR Portal — Team Time Sheets</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      .pm-app { max-width: 1200px; margin: auto; font-family: Arial, sans-serif; padding: 20px;
        --acc:#2f80d8; --acc-2:#1f6fc8; --tint:rgba(47,128,216,0.12); --tint-2:rgba(47,128,216,0.22);
        --badge-text:#1f6fc8; --gold:#d6a13a; --warm:rgba(214,161,58,0.14); --ok:#2fa679; --err:#d9614f; --exp:#1f9d6a; }
      @media (prefers-color-scheme: dark) { .pm-app { --badge-text:#9cc9f5; } }
      :root[data-theme="dark"] .pm-app { --badge-text:#9cc9f5; }
      .pm-section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: var(--shadow); }
      .pm-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; }
      .pm-header h2 { margin: 0; font-size: 22px; font-weight: 700; color: var(--text); }
      .pm-header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

      .pm-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
      .pm-stat-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; text-align: center; }
      .pm-stat-value { font-size: 28px; font-weight: 700; color: var(--acc); }
      .pm-stat-label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
      .pm-stat-card.warn .pm-stat-value { color: var(--gold); }
      .pm-stat-card.success .pm-stat-value { color: var(--ok); }

      .pm-week-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 1rem; flex-wrap: wrap; }
      .pm-week-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text); }
      .pm-week-btn:hover { background: var(--tint); border-color: var(--acc); color: var(--acc); }
      .pm-week-label { font-size: 15px; font-weight: 700; color: var(--text); min-width: 220px; text-align: center; }
      .pm-week-today { background: var(--acc); color: #fff; border-color: var(--acc); }
      .pm-week-today:hover { background: var(--acc-2); color: #fff; }

      .pm-filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .pm-filter-label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
      .pm-filter-select, .pm-filter-search { padding: 7px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: var(--surface); color: var(--text); color-scheme: light dark; }
      .pm-filter-select { min-width: 160px; } .pm-filter-search { min-width: 200px; }
      .pm-filter-select:focus, .pm-filter-search:focus { outline: none; border-color: var(--acc); }

      .pm-table-wrap { overflow-x: auto; }
      .pm-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .pm-table thead th { background: var(--surface-2); border-bottom: 2px solid var(--border); padding: 10px 8px; text-align: center; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; position: sticky; top: 0; }
      .pm-table thead th:first-child { text-align: left; min-width: 200px; }
      .pm-table thead th.weekend { background: var(--warm); }
      .pm-table thead th.col-total { background: var(--tint); color: var(--acc); min-width: 70px; }
      .pm-table tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
      .pm-table tbody tr:hover { background: var(--surface-2); }
      .pm-table tbody tr.drag-over-top { border-top: 3px solid var(--acc); }
      .pm-table tbody tr.drag-over-bottom { border-bottom: 3px solid var(--acc); }
      .pm-table tbody tr.dragging { opacity: 0.4; background: var(--tint); }
      .pm-table tbody td { padding: 10px 8px; text-align: center; vertical-align: middle; }
      .pm-table tbody td:first-child { text-align: left; font-weight: 600; color: var(--text); }
      .pm-table tfoot td { padding: 10px 8px; text-align: center; font-weight: 700; border-top: 2px solid var(--border); background: var(--surface-2); color: var(--acc); }
      .pm-table tfoot td:first-child { text-align: left; color: var(--text-muted); }

      .pm-cell-hrs { display: inline-block; min-width: 32px; padding: 3px 8px; border-radius: 4px; font-weight: 600; font-size: 13px; cursor: pointer; transition: background 0.1s; color: var(--text); }
      .pm-cell-hrs:hover { background: var(--tint-2); }
      .pm-cell-hrs.has-hours { background: var(--tint); color: var(--badge-text); }
      .pm-cell-hrs.zero { color: var(--text-muted); opacity: .6; }
      .pm-cell-hrs.overtime { background: var(--warm); color: var(--gold); }
      .pm-cell-hrs.weekend-hrs { background: var(--warm); color: var(--gold); }
      .pm-cell-total { font-weight: 700; font-size: 14px; color: var(--acc); }
      .pm-cell-total.low { color: var(--err); }
      .pm-cell-total.good { color: var(--ok); }
      .pm-cell-total.over { color: var(--gold); }

      .pm-emp-cell { display: flex; align-items: center; gap: 6px; }
      .pm-drag-handle { cursor: grab; color: var(--text-muted); font-size: 16px; padding: 2px 4px; flex-shrink: 0; user-select: none; }
      .pm-drag-handle:hover { color: var(--acc); }
      .pm-drag-handle:active { cursor: grabbing; }
      .pm-emp-name { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
      .pm-emp-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
      .pm-emp-details { line-height: 1.3; }
      .pm-emp-id { font-size: 10px; color: var(--text-muted); font-weight: 400; }

      .pm-detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
      .pm-detail-box { background: var(--surface); color: var(--text); border-radius: 12px; padding: 1.75rem; width: 650px; max-width: 95vw; max-height: 85vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.35); }
      .pm-detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
      .pm-detail-header h3 { margin: 0; font-size: 17px; color: var(--text); }
      .pm-detail-close { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; font-size: 15px; cursor: pointer; color: var(--text); }
      .pm-detail-close:hover { background: var(--surface-2); }

      .pm-no-data { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 14px; }
      .pm-missing-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--border); }

      .pm-legend { display: flex; gap: 16px; align-items: center; margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--border); flex-wrap: wrap; }
      .pm-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
      .pm-legend-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); }

      .pm-btn-export { background: var(--exp); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
      .pm-btn-export:hover { filter: brightness(0.92); }
      .pm-btn-add { background: var(--acc); color: #fff; border: none; padding: 6px 14px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 600; }
      .pm-btn-add:hover { background: var(--acc-2); }
      .pm-btn-edit { background: none; border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; color: var(--text-muted); }
      .pm-btn-edit:hover { background: var(--tint); border-color: var(--acc); color: var(--acc); }
      .pm-btn-delete { background: none; border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; color: var(--err); }
      .pm-btn-delete:hover { background: rgba(200,55,31,0.15); }
      .pm-btn-save { background: var(--acc); color: #fff; border: none; padding: 9px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
      .pm-btn-save:hover { background: var(--acc-2); }
      .pm-btn-save:disabled { background: #7a8595; cursor: not-allowed; }
      .pm-btn-cancel { background: var(--surface); border: 1px solid var(--border); padding: 9px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--text); }
      .pm-btn-cancel:hover { background: var(--surface-2); }
      .pm-btn-danger { background: rgba(200,55,31,0.15); color: var(--err); border: none; padding: 9px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
      .pm-btn-danger:hover { background: rgba(200,55,31,0.28); }
      .pm-btn-reset-order { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-muted); }
      .pm-btn-reset-order:hover { background: var(--surface-2); color: var(--text); }

      .pm-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
      .pm-form-full { grid-column: 1 / -1; }
      .pm-form-label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; display: block; }
      .pm-form-input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: var(--surface); color: var(--text); color-scheme: light dark; }
      .pm-form-input:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px var(--tint-2); }
      .pm-form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; align-items: center; }
      .pm-form-msg { font-size: 13px; margin-top: 8px; }

      .pm-entry-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
      .pm-entry-row:last-child { border-bottom: none; }
      .pm-entry-info { flex: 1; min-width: 0; }
      .pm-entry-project { font-weight: 600; font-size: 13px; color: var(--text); }
      .pm-entry-work { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pm-entry-hrs { flex-shrink: 0; }
      .pm-entry-actions { display: flex; gap: 4px; flex-shrink: 0; }
      .pm-entry-schedule { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

      .hrs-badge { display: inline-block; background: var(--tint-2); color: var(--badge-text); border-radius: 4px; padding: 1px 5px; font-size: 10px; font-weight: 700; }
      .pm-order-hint { font-size: 11px; color: var(--text-muted); margin-bottom: 0.5rem; font-style: italic; }

      .pm-schedule { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-top: 8px; }
      .pm-schedule-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
      .pm-schedule-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
      .pm-schedule-session { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
      .pm-schedule-session-title { font-size: 10px; font-weight: 700; color: var(--acc); text-transform: uppercase; margin-bottom: 6px; }
      .pm-sched-row { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
      .pm-sched-row:last-child { margin-bottom: 0; }
      .pm-sched-label { font-size: 10px; color: var(--text-muted); font-weight: 600; min-width: 32px; }
      .pm-sched-time { padding: 5px 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; width: 100px; background: var(--surface); color: var(--text); color-scheme: light dark; }
      .pm-sched-time:focus { outline: none; border-color: var(--acc); }
      .pm-sched-lunch { padding: 5px 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; width: 60px; text-align: center; background: var(--surface); color: var(--text); }
      .pm-sched-lunch:focus { outline: none; border-color: var(--acc); }
      .pm-calc-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding: 6px 10px; border-radius: 5px; font-size: 12px; flex-wrap: wrap; gap: 4px; }
      .pm-calc-match { background: rgba(15,110,86,0.16); color: var(--ok); }
      .pm-calc-mismatch { background: var(--warm); color: var(--gold); }
    </style>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171d25" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DCR Portal" />
  </head>
  <body>
    <div class="topbar">
      <div class="brand"><img class="brand-logo" src="logo.png" alt="DCR Framing" /><h1 id="companyName">DCR Portal</h1></div>
      <div class="top-actions">
        <span class="pill" id="userPill">…</span>
        <a class="btn btn-ghost btn-sm" href="dashboard.html">Dashboard</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="pm-app" id="pmApp">
      <div class="pm-section">
        <div class="pm-header">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          <h2>Team Time Sheets</h2>
          <div class="pm-header-actions">
            <button class="pm-btn-add" onclick="openAddForm()" style="padding:8px 16px;font-size:13px;">&#43; Add Entry</button>
            <button class="pm-btn-export" onclick="exportCSV()">&#8615; Export CSV</button>
            <a class="pm-btn-reset-order" href="report-timecard.html" style="text-decoration:none">🖨 Time card</a>
            <button class="pm-btn-reset-order" onclick="resetOrder()">&#8634; Reset order</button>
            <button class="pm-week-btn" onclick="loadAllData()" style="font-size:12px;">&#8635; Refresh</button>
          </div>
        </div>
        <div id="pmScopeNote" class="pm-order-hint" style="margin-bottom:1rem;"></div>
        <div id="pmStats" class="pm-stats">
          <div class="pm-stat-card"><div class="pm-stat-value">-</div><div class="pm-stat-label">Total Hours</div></div>
          <div class="pm-stat-card"><div class="pm-stat-value">-</div><div class="pm-stat-label">Employees</div></div>
          <div class="pm-stat-card"><div class="pm-stat-value">-</div><div class="pm-stat-label">Entries</div></div>
          <div class="pm-stat-card"><div class="pm-stat-value">-</div><div class="pm-stat-label">Projects</div></div>
        </div>
        <div class="pm-week-nav">
          <button class="pm-week-btn" onclick="changeWeek(-1)">&#9664; Prev week</button>
          <div class="pm-week-label" id="pmWeekLabel">Loading…</div>
          <button class="pm-week-btn" onclick="changeWeek(1)">Next week &#9654;</button>
          <button class="pm-week-btn pm-week-today" onclick="goToCurrentWeek()">Today</button>
        </div>
        <div class="pm-filters">
          <span class="pm-filter-label">Filter:</span>
          <select class="pm-filter-select" id="pmFilterProject" onchange="renderTable()"><option value="">All projects</option></select>
          <input class="pm-filter-search" id="pmFilterEmployee" type="text" placeholder="Search employee…" oninput="renderTable()">
        </div>
      </div>

      <div class="pm-section">
        <div class="pm-order-hint">&#9776; Drag rows to reorder employees. Order is saved on this device.</div>
        <div class="pm-table-wrap"><div id="pmTableArea"><div class="pm-no-data">Loading time sheets…</div></div></div>
        <div class="pm-legend">
          <div class="pm-legend-item"><div class="pm-legend-swatch" style="background:var(--tint);"></div> Has hours</div>
          <div class="pm-legend-item"><div class="pm-legend-swatch" style="background:var(--warm);"></div> Overtime / weekend</div>
          <div class="pm-legend-item"><div class="pm-legend-swatch" style="background:var(--border);width:8px;height:8px;border-radius:50%;"></div> No entry</div>
          <div class="pm-legend-item"><span style="color:var(--ok);font-weight:700;">40</span> = Full week</div>
          <div class="pm-legend-item"><span style="color:var(--err);font-weight:700;">24</span> = Under 40</div>
          <div class="pm-legend-item"><span style="color:var(--gold);font-weight:700;">48</span> = Over 40</div>
        </div>
      </div>
      <div id="pmModalContainer"></div>
    </div>

    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="timesheet-manager.js"></script>
  </body>
</html>
