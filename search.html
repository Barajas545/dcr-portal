<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DCR Portal — Search</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .se{
        --acc:#2f80d8; --acc-2:#1f6fc8; --tint:rgba(47,128,216,0.12); --tint-2:rgba(47,128,216,0.22);
        max-width:760px; margin:0 auto; padding:20px 16px 60px;
      }
      .se-box{position:relative; margin-bottom:18px;}
      .se-input{
        width:100%; box-sizing:border-box; padding:14px 18px; font-size:16px;
        border:2px solid var(--border); border-radius:14px; background:var(--surface); color:var(--text);
      }
      .se-input:focus{outline:none; border-color:var(--acc); box-shadow:0 0 0 4px var(--tint);}
      .se-note{font-size:12.5px; color:var(--text-muted); margin:-8px 0 16px; min-height:16px;}
      .se-grp{margin-bottom:18px;}
      .se-grp h3{margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.06em;
        color:var(--text-muted); display:flex; align-items:center; gap:8px;}
      .se-count{background:var(--surface-2); border-radius:11px; padding:1px 8px; font-size:11px; font-weight:700;}
      .se-item{
        display:block; background:var(--surface); border:1px solid var(--border); border-radius:10px;
        padding:11px 14px; margin-bottom:7px; text-decoration:none; transition:border-color .1s;
      }
      a.se-item:hover{border-color:var(--acc);}
      .se-title{font-size:14.5px; font-weight:600; color:var(--text);}
      .se-sub{font-size:12px; color:var(--text-muted); margin-top:2px;}
      .se-sub a{color:var(--acc); text-decoration:none;}
      /* project rows carry the folder's Thumnail.png */
      .se-item.thumbed{display:flex; align-items:center; gap:12px;}
      .se-thumb{width:64px; height:48px; flex-shrink:0; border-radius:8px; overflow:hidden;
        background:var(--surface-2); display:flex; align-items:center; justify-content:center;
        font-size:20px; color:var(--text-muted);}
      .se-thumb img{width:100%; height:100%; object-fit:cover;}
      .se-item.thumbed .se-txt{min-width:0; flex:1;}
      @media (max-width:520px){ .se-thumb{width:52px; height:40px;} }
      /* A project with a folder in the plans archive: the tile's link and its
         floor-plan button sit side by side in .se-proj, and the button is laid
         over the right edge of the tile, inside its border. The wrapper takes
         the tile's bottom gap so 50% is the middle of the tile, and it has no
         z-index or transform, which would trap the open menu under the next tile. */
      .se-proj{position:relative; margin-bottom:7px;}
      .se-proj > .se-item{margin-bottom:0;}
      .se-item.has-plans{padding-right:62px;}
      .se-plans{position:absolute; right:8px; top:50%; margin-top:-22px; width:44px; height:44px; padding:0;
        display:flex; align-items:center; justify-content:center;
        background:var(--surface); color:var(--acc); border:1px solid var(--border); border-radius:10px;}
      .se-plans svg{display:block;}
      .se-plans:hover{background:var(--tint); border-color:var(--acc);}
      .se-plans[aria-expanded="true"]{background:var(--tint-2); border-color:var(--acc);}
      .se-plans:focus-visible{outline:2px solid var(--acc); outline-offset:2px;}
      .se-plans.none{color:var(--text-muted); opacity:.6;}
      /* The plan-files menu: a panel hanging under the button on a wide
         screen. Its z-index keeps it over the tiles below but under the
         sticky top bar (10) and the DCR alerts (50). */
      .se-pm{position:absolute; top:calc(50% + 26px); right:0; width:min(380px, calc(100vw - 32px));
        max-height:min(60vh, 440px); display:flex; flex-direction:column; z-index:5;
        background:var(--surface); color:var(--text); border:1px solid var(--border);
        border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
      .se-pm:focus{outline:none;}
      .se-pm-head{display:flex; align-items:center; gap:10px; padding:8px 10px 8px 14px; border-bottom:1px solid var(--border);}
      .se-pm-title{flex:1; min-width:0; font-size:14px; overflow-wrap:anywhere;}
      .se-pm-close{background:none; color:var(--text); border:1px solid var(--border); border-radius:8px;
        padding:6px 12px; min-height:36px; font-size:13px;}
      .se-pm-close:hover{border-color:var(--acc);}
      .se-pm-close:focus-visible{outline:2px solid var(--acc); outline-offset:1px;}
      .se-pm-body{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:6px;}
      .se-pm-foot{padding:8px 14px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text-muted);}
      .se-pm-msg{padding:14px 10px; font-size:13.5px; color:var(--text-muted);}
      .se-pm-trunc{padding:8px 10px; font-size:12px; font-style:italic;}
      .se-pm-file, .se-pm-fold{display:flex; width:100%; text-align:left; background:none; border:0;
        border-radius:8px; color:var(--text);}
      .se-pm-file{align-items:flex-start; gap:10px; padding:8px 10px; min-height:44px;}
      .se-pm-fold{align-items:center; gap:6px; padding:8px 10px; min-height:40px; font-size:13px; font-weight:600;}
      .se-pm-file:hover, .se-pm-fold:hover{background:var(--surface-2);}
      .se-pm-file:focus-visible, .se-pm-fold:focus-visible{outline:2px solid var(--acc); outline-offset:-2px;}
      .se-pf-ic{flex-shrink:0; font-size:18px; line-height:1.3;}
      .se-pf-txt{flex:1; min-width:0; display:flex; flex-direction:column;}
      /* Plan names run to 139 characters, some with no spaces: wrap anywhere, never cut. */
      .se-pf-name, .se-pm-fname{overflow-wrap:anywhere; min-width:0;}
      .se-pf-name{font-size:14px; font-weight:600;}
      .se-pf-meta{font-size:12px; color:var(--text-muted);}
      .se-pm-car::before{content:"▸"; display:inline-block; width:12px; color:var(--text-muted); transition:transform .12s;}
      .se-pm-fold[aria-expanded="true"] .se-pm-car::before{transform:rotate(90deg);}
      .se-pm-kids{padding-left:16px;}
      .se-pm-kids[hidden]{display:none;}
      /* While a picked file's link is fetched the rest of the list rests. */
      .se-pm[aria-busy="true"] .se-pm-file, .se-pm[aria-busy="true"] .se-pm-fold{opacity:.55; cursor:progress;}
      .se-pm[aria-busy="true"] .se-pm-file.picked{opacity:1;}
      .se-scrim{display:none;}
      /* On a phone the menu is a sheet along the bottom of the screen over a
         scrim; tapping the scrim only closes the sheet. A phone held sideways
         is wider than 600px but under 500px tall, where the hanging panel
         would show about one plan at a time, so a short screen gets the sheet
         too. search.js (SHEET_MQ) asks the same question: keep them the same. */
      @media (max-width:599px), (max-height:500px){
        .se-scrim{display:block; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:30; touch-action:none;}
        .se-pm{position:fixed; top:auto; left:0; right:0; bottom:0; width:auto; max-height:70vh; z-index:31;
          border-radius:14px 14px 0 0; border-bottom:0; padding-bottom:env(safe-area-inset-bottom);}
      }
      .se-more{font-size:12px; color:var(--text-muted); font-style:italic; padding:2px 4px;}
      .se-empty{padding:36px; text-align:center; color:var(--text-muted); font-size:14px;}
    </style>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171d25" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DCR Portal" />
    <script>/* theme before first paint; see DCR.theme in common.js */try{var t=localStorage.getItem("dcr_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
  </head>
  <body>
    <div class="topbar">
      <div class="brand"><img class="brand-logo" src="logo.png" alt="DCR Framing" /><h1 id="companyName">DCR Portal</h1></div>
      <div class="top-actions">
        <span class="pill" id="userPill">…</span>
        <a class="btn btn-ghost btn-sm" href="dashboard.html">Home</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="se">
      <div class="se-box">
        <input id="seInput" class="se-input" type="search" placeholder="Search projects, contacts, leads, estimates, logs, tasks…" autocomplete="off" autofocus />
      </div>
      <div class="se-note" id="seNote"></div>
      <div id="seResults"><div class="se-empty">Type at least 2 characters to search.</div></div>
    </div>

    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="takeoff-open.js"></script>
    <script src="search.js"></script>
  </body>
</html>
