<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DCR Portal — Leads</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .ld{
        --acc:#2f80d8; --acc-2:#1f6fc8; --tint:rgba(47,128,216,0.12); --tint-2:rgba(47,128,216,0.22);
        --gold:#d6a13a; --ok:#2fa679; --err:#d9614f;
        max-width:1000px; margin:0 auto; padding:14px 16px 60px;
      }
      .ld-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
      .ld-head h2{margin:0; font-size:19px; color:var(--text);}
      .ld-search{flex:1; min-width:150px; max-width:300px; padding:8px 12px; font-size:14px;
        border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text);}
      .ld-search:focus{outline:none; border-color:var(--acc);}
      .ld-btn{padding:8px 14px; font-size:13px; font-weight:600; border-radius:8px; cursor:pointer;
        border:1px solid var(--border); background:var(--surface); color:var(--text);}
      .ld-btn:hover{background:var(--surface-2);}
      .ld-btn-primary{background:var(--acc); border-color:var(--acc); color:#fff;}
      .ld-btn-primary:hover{background:var(--acc-2);}
      .ld-btn-sm{padding:5px 10px; font-size:12px;}
      .ld-chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
      .ld-chip{padding:6px 13px; border-radius:15px; font-size:12.5px; font-weight:600; cursor:pointer;
        border:1px solid var(--border); background:var(--surface); color:var(--text-muted);}
      .ld-chip.on{background:var(--acc); border-color:var(--acc); color:#fff;}
      .ld-card{background:var(--surface); border:1px solid var(--border); border-radius:12px;
        padding:14px 16px; margin-bottom:10px;}
      .ld-top{display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap;}
      .ld-name{font-size:15.5px; font-weight:700; color:var(--text);}
      .ld-cat{font-size:11px; font-weight:700; padding:2px 9px; border-radius:11px;
        background:var(--tint); color:var(--acc);}
      .ld-flag{font-size:11px; font-weight:700; color:var(--ok);}
      .ld-age{margin-left:auto; font-size:11.5px; font-weight:700;}
      .ld-age.ok{color:var(--ok);} .ld-age.warn{color:var(--gold);} .ld-age.over{color:var(--err);}
      .ld-meta{font-size:13px; color:var(--text-muted); margin-top:4px;}
      .ld-meta a{color:var(--acc); text-decoration:none;}
      .ld-notes{font-size:12.5px; color:var(--text); margin-top:6px; white-space:pre-wrap;}
      .ld-actions{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
      .ld-empty{padding:30px; text-align:center; color:var(--text-muted);}
      .ld-msg{font-size:12px; min-height:15px;}
      .ld-msg.err{color:var(--err);}

      .ld-overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
        align-items:center; justify-content:center; z-index:60; padding:14px;}
      .ld-overlay.open{display:flex;}
      .ld-modal{background:var(--surface); color:var(--text); border:1px solid var(--border);
        border-radius:14px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto;
        padding:20px; box-shadow:0 8px 32px rgba(0,0,0,.4);}
      .ld-modal h3{margin:0 0 14px; font-size:16px;}
      .ld-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
      .ld-f label{display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:4px;}
      .ld-f input,.ld-f textarea{width:100%; box-sizing:border-box; padding:9px 11px; font-size:14px;
        border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); color-scheme:light dark;}
      .ld-f input:focus,.ld-f textarea:focus{outline:none; border-color:var(--acc);}
      .ld-f.full{grid-column:1/-1;}
      .ld-modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand"><img class="brand-logo" src="logo.png" alt="DCR Framing" /><h1 id="companyName">DCR Portal</h1></div>
      <div class="top-actions">
        <span class="pill" id="userPill">…</span>
        <a class="btn btn-ghost btn-sm" href="board.html?view=sales">Sales Board</a>
        <a class="btn btn-ghost btn-sm" href="dashboard.html">Dashboard</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="ld">
      <div class="ld-head">
        <h2>📞 Sales Leads</h2>
        <input class="ld-search" id="ldSearch" type="search" placeholder="Search leads…" />
        <button class="ld-btn ld-btn-primary" id="ldNewBtn" style="display:none">＋ New lead</button>
        <button class="ld-btn" id="ldRefresh">↻</button>
      </div>
      <div class="ld-chips" id="ldChips"></div>
      <div id="ldList"><div class="ld-empty">Loading leads…</div></div>
    </div>

    <!-- lead edit modal -->
    <div class="ld-overlay" id="ldModal">
      <div class="ld-modal">
        <h3 id="ldModalTitle">Lead</h3>
        <div class="ld-grid">
          <div class="ld-f"><label>Client name *</label><input id="lf_leadClientName" /></div>
          <div class="ld-f"><label>Phone</label><input id="lf_leadClientPhone" /></div>
          <div class="ld-f full"><label>Address</label><input id="lf_leadClientAddress" /></div>
          <div class="ld-f"><label>Project name</label><input id="lf_leadProjectName" /></div>
          <div class="ld-f"><label>Category</label><input id="lf_leadCategory" list="ldCats" /><datalist id="ldCats"></datalist></div>
          <div class="ld-f"><label>Source</label><input id="lf_leadSource" list="ldSrcs" /><datalist id="ldSrcs"></datalist></div>
          <div class="ld-f"><label>Lead date</label><input type="date" id="lf_leadDate" /></div>
          <div class="ld-f full"><label>Notes</label><textarea id="lf_leadNotes" rows="4"></textarea></div>
        </div>
        <div class="ld-msg err" id="ldModalMsg"></div>
        <div class="ld-modal-actions">
          <button class="ld-btn" id="ldCancel">Cancel</button>
          <button class="ld-btn ld-btn-primary" id="ldSave">✓ Save lead</button>
        </div>
      </div>
    </div>

    <!-- convert modal -->
    <div class="ld-overlay" id="cvModal">
      <div class="ld-modal" style="max-width:420px">
        <h3>Convert lead to project</h3>
        <div class="ld-f" style="margin-bottom:10px"><label>Internal ID number *</label><input id="cvId" placeholder="e.g. A055" /></div>
        <div class="ld-f" style="margin-bottom:10px"><label>Project name *</label><input id="cvName" /></div>
        <div class="ld-grid">
          <div class="ld-f"><label>Address</label><input id="cvAddr" /></div>
          <div class="ld-f"><label>City</label><input id="cvCity" /></div>
        </div>
        <p class="ld-meta" style="margin-top:8px">Creates the project as a <b>New Request</b> on the board and flags this lead as estimate-created.</p>
        <div class="ld-msg err" id="cvMsg"></div>
        <div class="ld-modal-actions">
          <button class="ld-btn" id="cvCancel">Cancel</button>
          <button class="ld-btn ld-btn-primary" id="cvGo">→ Create project</button>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="leads.js"></script>
  </body>
</html>
