<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DCR Portal — Home</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .hm{
        --acc:#2f80d8; --acc-2:#1f6fc8; --tint:rgba(47,128,216,0.12); --tint-2:rgba(47,128,216,0.22);
        max-width:960px; margin:0 auto; padding:26px 18px 60px;
      }
      .hm-hero{text-align:center; margin-bottom:26px;}
      .hm-hero h2{margin:0 0 4px; font-size:24px; color:var(--text);}
      .hm-hero p{margin:0 0 18px; font-size:14px; color:var(--text-muted);}
      .hm-searchwrap{position:relative; max-width:560px; margin:0 auto;}
      .hm-search{
        width:100%; box-sizing:border-box; padding:14px 48px 14px 18px; font-size:16px;
        border:2px solid var(--border); border-radius:14px; background:var(--surface); color:var(--text);
      }
      .hm-search:focus{outline:none; border-color:var(--acc); box-shadow:0 0 0 4px var(--tint);}
      .hm-searchbtn{
        position:absolute; right:6px; top:50%; transform:translateY(-50%);
        border:none; background:var(--acc); color:#fff; border-radius:10px;
        padding:8px 14px; font-size:15px; cursor:pointer;
      }
      .hm-searchbtn:hover{background:var(--acc-2);}
      .hm-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px;}
      .hm-card{
        display:flex; flex-direction:column; gap:6px;
        background:var(--surface); border:1px solid var(--border); border-radius:14px;
        padding:16px; transition:border-color .12s, box-shadow .12s, transform .06s;
      }
      /* The whole card is still one click target — it is just no longer one
         element, because the view links inside it are anchors too. */
      .hm-card .hm-card-go{
        display:flex; flex-direction:column; gap:6px; text-decoration:none; color:inherit;
        flex:1;
      }
      .hm-card:hover{border-color:var(--acc); box-shadow:0 3px 14px rgba(0,0,0,.12); transform:translateY(-1px);}
      .hm-card .ic{font-size:26px; line-height:1;}
      .hm-card .tt{font-size:15px; font-weight:700; color:var(--text);}
      .hm-card .ds{font-size:12px; color:var(--text-muted); line-height:1.4;}
      .hm-card .links{display:flex; gap:6px; flex-wrap:wrap; margin-top:2px;}
      .hm-card .links a{font-size:11px; font-weight:600; color:var(--acc); text-decoration:none;
        padding:2px 8px; border:1px solid var(--border); border-radius:10px;}
      .hm-card .links a:hover{background:var(--tint);}
      /* Invoices waiting for someone to approve them. Above the app cards on
         purpose: it is the only thing on this screen that is somebody's job
         today, and a queue you have to go looking for is a queue nobody works. */
      /* --err and --gold are defined inside .pm-app on the chart page, not
         globally; the global palette calls it --danger and has no gold at all.
         Naming them here keeps the banner red where it has to be red — an
         undefined var makes the whole declaration invalid, which would have
         quietly dropped the border and the colour that make this thing shout. */
      #hmApprovals{--err:var(--danger); --gold:#b8860b;}
      .hm-ap{border:2px solid var(--err); border-radius:12px; padding:14px 16px; margin-bottom:18px;
        background:rgba(217,97,79,.08);}
      .hm-ap h3{margin:0 0 2px; font-size:15px; font-weight:800; color:var(--err);}
      .hm-ap .sub{font-size:12px; color:var(--text-muted); margin-bottom:10px;}
      .hm-ap table{width:100%; border-collapse:collapse; font-size:12.5px;}
      .hm-ap td{padding:6px 4px; border-top:1px solid var(--border); vertical-align:top;}
      .hm-ap tr:first-child td{border-top:0;}
      .hm-ap .amt{text-align:right; white-space:nowrap; font-weight:700; font-variant-numeric:tabular-nums;}
      .hm-ap .who{font-weight:700;}
      .hm-ap .meta{color:var(--text-muted); font-size:11px;}
      .hm-ap .late{color:var(--err); font-weight:700;}
      .hm-ap .nodoc{color:var(--gold); font-weight:700;}
      .hm-ap a.go{color:var(--acc); text-decoration:none; white-space:nowrap;}
      .hm-ap a.go:hover{text-decoration:underline;}
      .hm-ap .more{font-size:12px; color:var(--text-muted); padding-top:8px;}

      .hm-sec{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
        color:var(--text-muted); margin:22px 0 10px;}
    </style>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171d25" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DCR Portal" />
    <script>/* theme before first paint; see DCR.theme in common.js */try{var t=localStorage.getItem("dcr_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
  </head>
  <body>
    <div class="topbar">
      <div class="brand"><img class="brand-logo" src="logo.png" alt="DCR Framing" /><h1 id="companyName">DCR Portal</h1></div>
      <div class="top-actions">
        <span class="pill" id="userPill">…</span>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="hm">
      <div class="hm-hero">
        <span style="background:#fff;border-radius:16px;padding:10px;display:inline-flex;box-shadow:0 1px 5px rgba(0,0,0,.18);margin-bottom:12px">
          <img id="hmLogo" src="logo.jpg" alt="" style="height:64px;width:auto" />
        </span>
        <h2 id="hmGreeting">Welcome</h2>
        <p>Search anything — projects, contacts, leads, estimates, logs, tasks…</p>
        <div class="hm-searchwrap">
          <input id="hmSearch" class="hm-search" type="search" placeholder="Search the whole database…" autocomplete="off" />
          <button class="hm-searchbtn" id="hmGo">🔍</button>
        </div>
        <div id="installSlot" style="margin-top:14px"></div>
      </div>

      <div id="hmApprovals"></div>
      <div id="hmSections"></div>
    </div>

    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="app.js"></script>
    <script src="install.js"></script>
  </body>
</html>
