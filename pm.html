<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DCR — Progress Chart</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      :root{
        --acc:#2f80d8; --acc-2:#1f6fc8; --tint:rgba(47,128,216,0.12); --tint-2:rgba(47,128,216,0.22);
        --gold:#d6a13a; --ok:#2fa679; --err:#d9614f;
        /* group-identity palette (light steps; CVD-validated, fixed order) */
        --gc0:#2a78d6; --gc1:#eb6834; --gc2:#1baf7a; --gc3:#eda100;
        --gc4:#e87ba4; --gc5:#008300; --gc6:#4a3aa7; --gc7:#e34948;
      }
      @media (prefers-color-scheme: dark){
        :root{
          /* same hues stepped for the dark surface */
          --gc0:#3987e5; --gc1:#d95926; --gc2:#199e70; --gc3:#c98500;
          --gc4:#d55181; --gc5:#008300; --gc6:#9085e9; --gc7:#e66767;
        }
      }
      /* full-bleed: the chart is the point of this page — use the whole monitor.
         Control rows stay readable: everything except the chart + tasks panel is
         capped and centered so a 4K screen doesn't strand the toolbar. */
      .pm{max-width:none; margin:0 auto; padding:14px 16px 40px;}
      .pm > *:not(.pm-scroll):not(.pm-tk){max-width:1900px; margin-left:auto; margin-right:auto;}
      .pm-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
      .pm-title{font-size:20px; font-weight:800;}
      .pm-sub{font-size:12.5px; color:var(--text-muted);}
      .pm-pill{font-size:12px; font-weight:700; padding:4px 12px; border-radius:13px; color:#fff; background:var(--acc);}
      .pm-head .sp{flex:1;}
      .pm-progress{height:10px; border-radius:6px; overflow:hidden; display:flex; gap:2px; margin:4px 0 8px;}
      .pm-progress span{height:100%;}
      .pm-cards{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
      .pm-card{background:var(--surface); border:1px solid var(--border); border-radius:10px;
        padding:8px 14px; min-width:120px;}
      .pm-card .k{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted);}
      .pm-card .v{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums;}
      .pm-bar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px;}
      .pm-bar input[type=search]{padding:7px 10px; border:1px solid var(--border); border-radius:8px;
        background:var(--surface); color:var(--text); min-width:190px;}
      .pm-bar select{padding:7px 8px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text);}
      .pm-chip{font-size:11.5px; padding:5px 11px; border-radius:12px; border:1.5px solid var(--border);
        cursor:pointer; background:var(--surface); color:var(--text);}
      .pm-chip.on{border-color:var(--gold); background:rgba(214,161,58,.13); font-weight:700;}
      .pm-legend{font-size:11px; color:var(--text-muted); margin-left:auto;}
      .pm-scroll{overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--surface);}
      .pm-stage{position:relative; display:flex; min-width:min-content;}
      .pm-count{font-size:11.5px; font-weight:700; color:var(--text-muted);}
      /* every item's identity is drawn inside the chart, beside its own nodes —
         see laneLabel() in pm-chart.js. There is no separate rail. */
      .pm-svgwrap svg [data-pm^="lane:"]:hover rect:first-of-type{filter:brightness(1.12);}
      /* project tasks panel */
      .pm-tk{margin-top:14px; border:1px solid var(--border); border-radius:12px; background:var(--surface); overflow:hidden;}
      .pm-tk .tk-hd{display:flex; align-items:center; gap:8px; padding:10px 14px; cursor:pointer;
        font-size:13px; font-weight:800;}
      .pm-tk .tk-hd:hover{background:var(--tint);}
      /* per-employee cards on a grid — a person's tasks never split apart */
      .pm-tk .tk-body{padding:2px 14px 12px; display:grid;
        grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); gap:4px 26px; align-items:start;}
      .pm-tk .tk-grp{min-width:0;}
      .pm-tk .tk-emp{font-size:12px; font-weight:800; margin:12px 0 4px;
        border-bottom:2px solid var(--border); padding-bottom:3px;}
      .pm-tk .tk-row{display:flex; gap:8px; padding:5px 0; border-bottom:1px solid var(--border);
        font-size:12px;}
      .pm-tk .tk-row.done{opacity:.65;}
      .pm-tk .tk-ic{flex-shrink:0; width:16px; text-align:center; font-weight:800;}
      .pm-tk .tk-row.done .tk-ic{color:var(--ok);}
      .pm-tk .tk-b{flex:1; min-width:0;}
      .pm-tk .tk-d{color:var(--text-muted); margin-top:1px;}
      .pm-tk .tk-w{color:var(--ok); margin-top:1px;}
      .pm-tk .tk-urg{font-size:8.5px; font-weight:800; color:#fff; background:var(--err); border-radius:6px; padding:1px 5px;}
      .pm-svgwrap{position:relative;}
      .pm-bandtitle{position:absolute; top:134px; font-size:12.5px; font-weight:800; letter-spacing:.04em;
        color:var(--text); cursor:pointer; display:flex; align-items:center; gap:6px; z-index:2;}
      .pm-bandtitle .pct{color:var(--text-muted); font-weight:600;}
      .pm-bandtitle .pdot{width:8px; height:8px; border-radius:50%; background:var(--acc); position:relative;}
      .pm-bandtitle .pdot::after{content:""; position:absolute; inset:-4px; border-radius:50%;
        border:2px solid var(--acc); animation:pmPulse 1.6s ease-out infinite;}
      @keyframes pmPulse{from{transform:scale(.6); opacity:.8} to{transform:scale(1.6); opacity:0}}
      .pm-pulse{transform-box:fill-box; transform-origin:center; animation:pmPulseSvg 1.8s ease-out infinite;}
      @keyframes pmPulseSvg{from{transform:scale(1); opacity:.55} to{transform:scale(1.8); opacity:0}}
      .pm-hold{background:rgba(217,97,79,.12); border:1px solid var(--err); color:var(--err);
        border-radius:10px; padding:8px 14px; font-weight:700; font-size:13px; margin-bottom:10px;}
      .pm-banner{background:var(--tint); border:1px solid var(--acc); border-radius:10px; padding:10px 14px;
        font-size:13px; margin-bottom:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
      .pm-empty{padding:34px; text-align:center; color:var(--text-muted); font-size:13.5px;}
      /* drawer */
      .pm-ovl{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50; opacity:0; pointer-events:none; transition:opacity .15s;}
      .pm-ovl.open{opacity:1; pointer-events:auto;}
      .pm-drawer{position:fixed; top:0; right:0; bottom:0; width:440px; max-width:100vw; z-index:51;
        background:var(--surface); border-left:1px solid var(--border); box-shadow:-6px 0 26px rgba(0,0,0,.25);
        transform:translateX(102%); transition:transform .18s; display:flex; flex-direction:column;}
      .pm-drawer.open{transform:none;}
      .pm-drawer .dh{display:flex; align-items:flex-start; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border);}
      .pm-drawer .db{flex:1; overflow-y:auto; padding:12px 16px 24px;}
      /* collapsible drawer sections */
      .pm-sec{border-bottom:1px solid var(--border);}
      .pm-sec:last-of-type{border-bottom:none;}
      .pm-sec-hd{display:flex; align-items:center; gap:8px; width:100%; padding:11px 2px;
        background:none; border:none; cursor:pointer; text-align:left; color:var(--text);
        font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-family:inherit;}
      .pm-sec-hd:hover{color:var(--acc);}
      .pm-sec-hd .cav{display:inline-block; width:10px; color:var(--text-muted); transition:transform .12s;
        transform:rotate(-90deg);}
      .pm-sec.open .pm-sec-hd .cav{transform:none;}
      .pm-sec-hd .n{font-weight:700; text-transform:none; letter-spacing:0; color:var(--text-muted); font-size:11.5px;}
      .pm-sec-bd{display:none; padding:0 2px 14px;}
      .pm-sec.open .pm-sec-bd{display:block;}
      .pm-sec-bd > .pm-h:first-child{margin-top:0;}
      .pm-h{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin:14px 0 6px;}
      .pm-money{display:flex; gap:8px; flex-wrap:wrap;}
      .pm-money .pm-card{min-width:96px; padding:6px 10px;}
      .pm-qt{width:100%; border-collapse:collapse; font-size:12px;}
      .pm-qt td{padding:6px 6px; border-bottom:1px solid var(--border); vertical-align:top;}
      .pm-st{font-size:10px; font-weight:700; border-radius:9px; padding:2px 8px; white-space:nowrap;}
      .pm-st.Requested{background:var(--tint); color:var(--acc);}
      .pm-st.Received{background:rgba(214,161,58,.15); color:var(--gold);}
      .pm-st.Awarded{background:rgba(47,166,121,.15); color:var(--ok);}
      .pm-st.Declined{background:var(--surface-2); color:var(--text-muted);}
      .pm-st.Self{background:var(--surface-2); color:var(--text);}
      .pm-form label{display:block; font-size:11px; color:var(--text-muted); margin:8px 0 2px;}
      .pm-form input, .pm-form textarea{width:100%; box-sizing:border-box; padding:7px 9px; font-size:13px;
        border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text);}
      .pm-sugg{position:relative;}
      .pm-sugg .list{position:absolute; left:0; right:0; top:100%; z-index:5; background:var(--surface);
        border:1px solid var(--acc); border-radius:9px; overflow:hidden; display:none;}
      .pm-sugg .list.on{display:block;}
      .pm-sugg .list div{padding:7px 10px; cursor:pointer; font-size:12.5px;}
      .pm-sugg .list div:hover{background:var(--tint);}
      .pm-sugg .list .none{cursor:default; color:var(--text-muted); font-size:12px;}
      .pm-sugg .list .none:hover{background:transparent;}
      .pm-msg{color:var(--err); font-size:12px; min-height:15px; margin-top:6px;}
      /* milestone popover */
      .pm-pop{position:fixed; z-index:60; min-width:230px; background:var(--surface); border:1px solid var(--border);
        border-radius:11px; box-shadow:0 10px 32px rgba(0,0,0,.35); padding:12px 14px; display:none;}
      .pm-pop.open{display:block;}
      @media (max-width:900px){ .pm-drawer{width:100vw;} }
      @media (min-width:2200px){ .pm-drawer{width:560px;} }
      @media print{
        .topbar, .pm-bar, .pm-head .btn, .pm-head select, .pm-drawer, .pm-ovl, .pm-pop{display:none !important;}
        .pm-scroll{border:none; overflow:visible;}
        .pm-scroll svg{width:100%; height:auto;}
      }
    </style>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171d25" />
  </head>
  <body>
    <div class="topbar">
      <div class="brand"><img class="brand-logo" src="logo.png" alt="DCR Framing" /><h1 id="companyName">DCR Portal</h1></div>
      <div class="top-actions">
        <span class="pill" id="userPill">…</span>
        <a class="btn btn-ghost btn-sm" href="dashboard.html">← Dashboard</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="pm" id="pmRoot"><div class="pm-empty">Loading…</div></div>

    <div class="pm-ovl" id="pmOvl"></div>
    <aside class="pm-drawer" id="pmDrawer" aria-label="Item detail"></aside>
    <div class="pm-pop" id="pmPop"></div>

    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="pm-chart.js"></script>
    <script src="pm.js"></script>
  </body>
</html>
